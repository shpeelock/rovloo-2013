<!-- Badge Detail Page - faithful port of 2013 Item.aspx (badge variant, boxed StandardPanelWhite)
     (structure mirrors the archived 1,000 Distance Badge page; functional ids preserved for badge.js) -->
<div id="ItemContainer" class="text">
    <div class="StandardPanelWhite ItemHeaderPanel">
        <p class="item-header notranslate" id="badge-name">Loading...</p>
        <p class="item-type"><b>ROBLOX Badge</b></p>
    </div>
    <div id="Item" class="StandardPanelWhite">
        <div id="Details">
            <div id="assetContainer">
                <div id="Thumbnail">
                    <a id="badge-large-link" class="AssetThumbnailImage" title="" onclick="return false" style="display:inline-block;height:320px;width:320px;">
                        <img id="badge-large-image" src="images/spinners/spinner100x100.gif" height="320" width="320" border="0" alt=""/>
                    </a>
                </div>
            </div>

            <div id="Summary">
                <div class="SummaryDetails">
                    <div id="Creator" class="Creator">
                        <div class="Avatar">
                            <a id="badge-creator-avatar-link" class="notranslate" title="" href="#" style="display:inline-block;height:70px;width:70px;cursor:pointer;">
                                <img id="badge-creator-avatar" src="images/spinners/spinner100x100.gif" height="70" width="70" border="0" alt=""/>
                            </a>
                        </div>
                    </div>
                    <div class="item-detail">
                        <span class="stat-label notranslate">Creator:</span>
                        <a id="badge-creator-link" class="stat notranslate" href="#">Loading...</a>
                        <div>
                            <span class="stat-label">Created:</span>
                            <span class="stat" id="badge-created">--</span>
                        </div>
                        <div id="LastUpdate">
                            <span class="stat-label">Updated:</span>
                            <span class="stat" id="badge-updated">--</span>
                        </div>
                    </div>

                    <div class="DescriptionPanel notranslate">
                        <pre id="badge-description" class="Description body text">No description available.</pre>
                    </div>


                    <!-- Earn this badge at (badge.js toggles display) — archive verbatim structure:
                         .Description text, 160x100 landscape place thumb, name BELOW the image -->
                    <div id="BadgePlaceSection" class="BadgePlaceLink" style="display:none;">
                        <div class="Description" style="overflow: hidden; margin-top: 5px;">
                            Earn this badge at:
                        </div>
                        <div class="AssetThumbnail">
                            <a id="badge-place-image-link" href="#" title="">
                                <img id="badge-place-image" src="images/spinners/spinner100x100.gif" width="160" height="100" border="0" alt=""/>
                            </a>
                        </div>
                        <div class="AssetDetails">
                            <div class="AssetName">
                                <a id="badge-place-name-link" href="#">Loading...</a>
                            </div>
                        </div>
                    </div>

                    <div class="GearGenreContainer">
                        <div id="GenresDiv">
                            <div class="stat-label">Genres:</div>
                            <div class="GenreInfo stat">
                                <div class="AssetGenreRepeater_Container">
                                    <div><img id="badge-genre-icon" src="assets/genres/Classic.png" width="16" height="16" alt="Genre" style="vertical-align:middle;"/></div>
                                    <div><a id="badge-genre-link" href="#games">All Genres</a></div>
                                </div>
                                <div style="clear:both;"></div>
                            </div>
                        </div>
                        <div class="clear"></div>
                    </div>
                </div>

                <div class="BuyPriceBoxContainer">
                    <div class="BuyPriceBox">
                        <div>
                            <a class="btn-primary btn-medium btn-disabled-primary" title="Badges cannot be purchased.">Buy Now <span class="btn-text">Buy Now</span></a>
                        </div>
                        <div class="clear"></div>
                        <div class="footnote">Badges are earned in games.</div>
                    </div>
                    <div class="clear"></div>
                </div>
                <div class="clear"></div>
            </div>

            <div class="clear"></div>
        </div>
    </div>
    <div class="clear"></div>
</div>
